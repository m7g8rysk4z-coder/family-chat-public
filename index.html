<body>
  <!-- Контент — оставь как есть -->
  <div id="contacts-view" class="view active">
    <header>
      <h1>Семейный чат</h1>
      <button id="add-contact-btn" class="btn-primary">➕ Добавить</button>
    </header>
    <div id="contacts-list" class="contact-list"></div>
  </div>

  <div id="chat-view" class="view">
    <header>
      <button id="back-btn" class="btn-icon">←</button>
      <span id="chat-contact-name">Контакт</span>
    </header>
    <div id="messages-container" class="messages-container"></div>
    <div class="input-area">
      <input type="file" id="photo-input" accept="image/*" hidden>
      <button id="add-photo-btn" class="btn-icon" title="Фото">📷</button>
      <input type="text" id="message-input" placeholder="Сообщение (нажмите Enter)">
      <button id="send-btn" class="btn-primary" disabled>➤</button>
    </div>
  </div>

  <div id="add-contact-modal" class="modal">
    <div class="modal-content">
      <h3>Добавить контакт</h3>
      <input type="text" id="contact-name" placeholder="Имя">
      <div class="modal-actions">
        <button id="add-contact-cancel" class="btn-secondary">Отмена</button>
        <button id="add-contact-save" class="btn-primary">Сохранить</button>
      </div>
    </div>
  </div>

  <div id="photo-lightbox" class="lightbox">
    <div class="lightbox-content">
      <span class="close-btn">&times;</span>
      <img id="lightbox-img" src="" alt="Фото">
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
